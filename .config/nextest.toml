# nextest configuration for the uwa workspace.
#
# Machine context: 2 physical cores / 4 threads, ~7.5G RAM, shared with
# other build sessions. Process-per-test model uses the cores better than
# libtest's in-binary threads, so test-threads stays at the default
# (logical CPUs = 4); guards are only against runaway processes.

[profile.default]
# A single test that exceeds 60s is almost certainly hung waiting on a
# port or a browser; 3 slow periods before we kill it instead of letting
# CI sit on it forever.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
fail-fast = { max-fail = 10 }
# flaky-test detection: e2e fixtures (browser/port races) may flake; a
# single retry is cheap compared to a re-run of the whole suite.
retries = { backoff = "exponential", count = 1, delay = "100ms", max-delay = "1s" }
slow-timeout = { period = "120s", terminate-after = 3 }
