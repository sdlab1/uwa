[package]
name = "devh"
edition = "2021"
version = "0.1.0"
description = "KISS dev harness: harness owns git, agent never runs it"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
regex = "1"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
