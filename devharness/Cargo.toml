[package]
name = "devh"
edition = "2021"
version = "0.1.0"
description = "KISS dev harness: harness owns git, agent never runs it"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
regex = "1"
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
walkdir = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# integration-тесты читают машинный JSON состояния (.harness/killmap.json и
# подобные) как значение, а не грепом по строкам: содержимое карты —
# часть контракта §5, доступ по имени поля устойчивее подстрочных проверок.
serde_json = "1"
