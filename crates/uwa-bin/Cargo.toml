[package]
name = "uwa-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "uwa"
path = "src/main.rs"

[features]
# Serve the MCP server over HTTP+SSE on `port + 1`.
mcp-http = ["uwa-mcp/mcp-http"]

[dependencies]
uwa-core.workspace = true
uwa-config = { path = "../uwa-config" }
uwa-api = { path = "../uwa-api" }
uwa-lifecycle = { path = "../uwa-lifecycle" }
uwa-providers = { path = "../uwa-providers" }
uwa-browser = { path = "../uwa-browser" }
uwa-stealth = { path = "../uwa-stealth" }
uwa-session = { path = "../uwa-session" }
uwa-resilience = { path = "../uwa-resilience" }
tokio.workspace = true
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
async-trait = { workspace = true }
axum = { workspace = true }
uwa-mcp = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
uwa-testkit = { path = "../uwa-testkit" }
