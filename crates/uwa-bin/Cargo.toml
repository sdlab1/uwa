[package]
name = "uwa-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "uwa"
path = "src/main.rs"

[features]
default = []
metrics = ["uwa-api/metrics"]

[dependencies]
uwa-core = { path = "../../uwa-core" }
uwa-config = { path = "../uwa-config" }
uwa-api = { path = "../uwa-api" }
uwa-mcp = { path = "../uwa-mcp" }
uwa-browser = { path = "../uwa-browser" }
uwa-providers = { path = "../uwa-providers" }
uwa-stealth = { path = "../uwa-stealth" }
uwa-session = { path = "../uwa-session" }
uwa-resilience = { path = "../uwa-resilience" }
uwa-lifecycle = { path = "../uwa-lifecycle" }

tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
async-trait.workspace = true
axum.workspace = true
serde_json.workspace = true
futures.workspace = true
dashmap.workspace = true


[dev-dependencies]
uwa-testkit = { path = "../uwa-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
