[package]
name = "uwa-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "uwa"
path = "src/main.rs"

[package.metadata.dist]
name = "uwa"

[features]
default = ["cdp", "nodriver"]
cdp = ["uwa-browser/cdp"]
nodriver = ["uwa-browser/nodriver"]
metrics = ["uwa-api/metrics"]

[dependencies]
uwa-core = { path = "../../uwa-core" }
uwa-config = { path = "../uwa-config" }
uwa-api = { path = "../uwa-api" }
uwa-browser = { path = "../uwa-browser", features = ["cdp", "nodriver"] }
uwa-providers = { path = "../uwa-providers" }
uwa-stealth = { path = "../uwa-stealth" }
uwa-session = { path = "../uwa-session" }
uwa-resilience = { path = "../uwa-resilience" }
uwa-lifecycle = { path = "../uwa-lifecycle" }
uwa-history = { path = "../uwa-history" }
uwa-conformance = { path = "../uwa-conformance" }
uwa-tools = { path = "../uwa-tools" }

tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
async-trait.workspace = true
axum.workspace = true
serde_json.workspace = true
futures.workspace = true
dashmap.workspace = true
dirs = "5"
ureq   = { workspace = true }
sha2   = { workspace = true }
flate2 = { workspace = true }
tar    = { workspace = true }
xz2    = { workspace = true }
zip    = { workspace = true }
serde.workspace = true
toml.workspace = true
url.workspace = true
serde_path_to_error.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
uwa-testkit = { path = "../uwa-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
