[server]
bind = "127.0.0.1"
port = 8080
api_key = "change-me"
request_timeout_ms = 120000
# pid_file = "/var/run/uwa.pid"

[stealth]
pack = "default"
# user_scripts_dir = "/etc/uwa/stealth.d"

[mcp_server]
enabled = false

# [[mcp_clients]]
# name = "fs"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

[model_aliases]
"gpt-4o"           = "chatgpt"
"gpt-4o-mini"      = "chatgpt"
"claude-3-5-sonnet" = "claude"
"gemini-1.5-pro"   = "gemini"
"deepseek-chat"    = "deepseek"

# ---------- ChatGPT ----------
[providers.chatgpt]
name = "chatgpt"
url_patterns = ["https://chatgpt.com/*", "https://chat.openai.com/*"]
capabilities = { streams = true, tool_calls = true, vision = false, max_context_tokens = 128000 }
extraction = "network_first"
selectors_version = "2026-01-01"

[providers.chatgpt.selectors]
input             = "#prompt-textarea"
send_button       = "[data-testid=send-button]"
stop_button       = "[data-testid=stop-button]"
assistant_message = "[data-message-author-role=assistant]"
conversation_root = "main"

[providers.chatgpt.finisher]
dom_stable_ms = 700
poll_ms = 150
min_wait_ms = 500
max_wait_ms = 120000

[providers.chatgpt.net]
url_contains = ["/backend-api/conversation"]
mime_contains = ["text/event-stream"]
idle_timeout_ms = 30000

[providers.chatgpt.net.decoder]
kind = "sse"
json_path = "v.message.content.parts.0"

# ---------- Claude ----------
[providers.claude]
name = "claude"
url_patterns = ["https://claude.ai/*"]
capabilities = { streams = true, tool_calls = true, vision = true, max_context_tokens = 200000 }
extraction = "dom_only"

[providers.claude.selectors]
input             = "div[contenteditable=true]"
send_button       = "button[aria-label='Send message']"
stop_button       = "button[aria-label='Stop']"
assistant_message = "[data-testid=assistant-message]"

# ---------- Gemini ----------
[providers.gemini]
name = "gemini"
url_patterns = ["https://gemini.google.com/*"]
capabilities = { streams = true, tool_calls = false, vision = true, max_context_tokens = 1000000 }
extraction = "dom_only"

[providers.gemini.selectors]
input             = "div.ql-editor"
send_button       = "button.send-button"
stop_button       = "button.stop-button"
assistant_message = "model-response"

# ---------- DeepSeek ----------
[providers.deepseek]
name = "deepseek"
url_patterns = ["https://chat.deepseek.com/*"]
capabilities = { streams = true, tool_calls = true, vision = false, max_context_tokens = 64000 }
extraction = "dom_only"

[providers.deepseek.selectors]
input             = "textarea#chat-input"
send_button       = "div[role=button].send"
stop_button       = "div[role=button].stop"
assistant_message = "[data-role=assistant]"