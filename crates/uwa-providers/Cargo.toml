[package]
name = "uwa-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
uwa-core.workspace = true
uwa-config.workspace = true
uwa-extract.workspace = true
uwa-resilience = { path = "../uwa-resilience" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "macros"] }
tracing.workspace = true
url.workspace = true
metrics = "0.23"
uwa-browser = { path = "../uwa-browser", optional = true }
uwa-stealth = { path = "../uwa-stealth", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
insta = { version = "1", features = ["yaml"] }

[features]
snapshot = ["dep:uwa-browser", "dep:uwa-stealth"]

[[bin]]
name = "uwa-snapshot"
path = "src/bin/snapshot.rs"
required-features = ["snapshot"]
