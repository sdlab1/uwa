[package]
name = "uwa-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
# Lets dependents build a [`ProviderCfg`] without repeating its fields;
# see `ProviderCfg::default_for_test`.
test-helpers = []

[dependencies]
uwa-core.workspace = true
serde.workspace = true
toml.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
url.workspace = true
# Used by the generated registry (serde_json::Value in capabilities,
# tracing::warn! on skipped entries) — the 33-scenario registry commit
# referenced them without declaring the dependencies.
serde_json.workspace = true
tracing.workspace = true
