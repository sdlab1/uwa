[workspace]
resolver = "2"
members = ["crates/*", "uwa-core", "devharness"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT"

# === ОПТИМИЗАЦИЯ РАЗМЕРА target/debug ===
[profile.dev]
# 1 = только номера строк (хватает для бэктрейсов), 0 = полностью отключить
debug = 1
# Увеличиваем codegen-units для параллельной компиляции (быстрее сборка, чуть больше размер)
codegen-units = 4
# Инкрементальная компиляция: пересборка после touch одного файла
# 16.4s -> 0.34s (x77) на devharness. Плата: папка target/ растёт
# (добавляется target/debug/incremental/), кеш НЕ шарится через sccache
# (инкрементальные единицы не кешируются по определению) и сбрасывается
# при смене флагов/тулчейна. Размер контролируется `cargo sweep`.
incremental = true
# Оптимизация по размеру даже в debug (немного замедляет код, но сильно сжимает)
opt-level = "s"

[profile.dev.package."*"]
# Отключаем дебаг-символы ТОЛЬКО для внешних зависимостей (токио, аксум, серде и т.д.)
# Это дает наибольший выигрыш в размере при минимальной потере удобства отладки
debug = 0

# === ТЕСТОВЫЙ ПРОФИЛЬ ===
# cargo test собирает в профиле `test`, который наследует `dev`, НО
# [profile.dev.package."*"] на него не распространяется: зависимости
# (tokio, serde_json, html5ever) линковались с opt-level=0, и все тесты
# исполняли неоптимизированный код. Правим здесь.
[profile.test]
# -O1 на весь граф тестов: 2-5x ускорение рантайма (парсинг HTML/JSON в тестах).
# Качество сгенерированного кода для тестов неважно, компиляция всё ещё быстрая.
opt-level = 1
# 16 CGU: на 2 физических ядра мелкие codegen-units дают больше параллелизма
# внутри крейта — сборка заметно быстрее; расплата чуть более медленным
# машинным кодом, что для короткоживущих тестов не имеет значения.
codegen-units = 16
# line-tables-only: в панике остаются file:line, но артефакты в разы меньше,
# линковка ~56 тест-бинарников заметно быстрее. Полный debug-info оставлен
# для профиля dev (cargo build), где отладка реально нужна.
debug = "line-tables-only"
# incremental остаётся выключенным (как в dev): машина — 2 ядра / ~7.5G RAM,
# инкрементальный кеш скорее приведёт к свопу, чем ускорит.
incremental = false

[workspace.dependencies]

uwa-core = { path = "uwa-core" }
uwa-config = { path = "crates/uwa-config" }

# async
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait  = "0.1"
futures      = "0.3"
# serde
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
serde_path_to_error = "0.1"
# errors/log
thiserror    = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# misc
url          = "2"
uuid         = { version = "1", features = ["v4", "serde"] }
dashmap      = "5"
axum         = { version = "0.7", features = ["json", "macros"] }
uwa-tools    = { path = "crates/uwa-tools" }
uwa-browser  = { path = "crates/uwa-browser" }
uwa-session  = { path = "crates/uwa-session" }
uwa-resilience = { path = "crates/uwa-resilience" }
uwa-extract  = { path = "crates/uwa-extract" }
uwa-stealth  = { path = "crates/uwa-stealth" }
uwa-providers = { path = "crates/uwa-providers" }
uwa-history  = { path = "crates/uwa-history" }
scraper      = "0.20"
# CLI-only: distribution, self-update, service install
sha2         = "0.10"
ureq         = { version = "2", default-features = false, features = ["tls", "gzip"] }
flate2       = "1"
tar          = "0.4"
xz2          = "0.1"
zip          = { version = "2", default-features = false, features = ["deflate"] }
