services:
  chromium:
    image: debian:bookworm-slim
    command: >
      sh -c "apt-get update && apt-get install -y chromium ca-certificates &&
             /usr/bin/chromium
               --headless=new
               --no-sandbox
               --disable-gpu
               --disable-dev-shm-usage
               --remote-debugging-address=0.0.0.0
               --remote-debugging-port=9222
               --user-data-dir=/data"
    volumes:
      - chromium-data:/data
    networks: [uwa]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:9222/json/version || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10

  uwa:
    build: .
    depends_on:
      chromium:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      UWA_CHROMIUM_WS: ws://chromium:9222/devtools/browser
      RUST_LOG: info,uwa=debug
    volumes:
      - ./uwa.toml:/etc/uwa/uwa.toml:ro
      - uwa-data:/var/lib/uwa
    networks: [uwa]
    restart: unless-stopped

volumes:
  chromium-data:
  uwa-data:

networks:
  uwa:
    driver: bridge