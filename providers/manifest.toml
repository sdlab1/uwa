# built-in copy that ships with the binary. When a provider's version in
# this manifest is newer, its entry file is downloaded and verified
# against the SHA256 recorded here before it replaces the cached copy.
#
# The registry is authoritative only for fields the user config leaves
# unset; per-field overrides in `uwa.toml` always win. See
# `docs/PROVIDERS.md` for the merge rules.

