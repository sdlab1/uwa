# cargo-mutants 27.x — общие параметры всех мутационных прогонов этого репо.
# Файл читается cargo-mutants по умолчанию (без --config); флаги командной
# строки и devh-MUTATE его перекрывают.
#
# Зачем: devh гоняет мутационный гейт на все изменённые src-файлы
# (см. docs/devh_fast_cycle.md, P1/P1b) — ложные таймауты и unviable-мутанты
# съедали бы осмысленность kill-rate.

# Мутанты не должны падать по таймауту из-за тяжёлых тестов uwa.
# (минимум — нижняя граница авто-таймаута; не сокращает легитимные таймауты)
timeout_multiplier = 2.0
minimum_test_timeout = 20

# Линты в мутантах не нужны: deny-лишние предупреждения делают мутанта
# unviable («не собирается») — это молчаливый обход гейта, а не kill.
cap_lints = true

# Процесс-на-тест: точные таймауты и быстрее, чем cargo test на каждый мутант.
test_tool = "nextest"

# Прод-код: тесты/бенчи/доки/сборки мутатору не нужны.
exclude_globs = [
  "docs/**",
  "dist/**",
  "target/**",
  "tests/**",
  "benches/**",
  "crates/*/tests/**",
  "crates/*/examples/**",
]
