name: ci
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "uwa-api/metrics"
          - "uwa-mcp/mcp-http"
          - "uwa-bin/metrics"
          - "uwa-providers/snapshot"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

  proptest:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env: { PROPTEST_CASES: "5000" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p uwa-tools --test proptest_parser
          cargo test -p uwa-extract --test proptest_net

  cdp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - name: Start headless Chromium
        run: |
          chromium-browser --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/cdp &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version && break
            sleep 1
          done
      - name: Run CDP integration
        env:
          UWA_CHROMIUM: "1"
          UWA_CHROMIUM_WS: "ws://127.0.0.1:9222/devtools/browser"
        run: cargo test -p uwa-browser -- --ignored --test-threads=1