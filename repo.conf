# repo.conf - list of source folders/files of project_uwa (Rust only).
# Each line: ALIAS=path (a folder or a single file), relative to repo root.
#
# dump.sh collects from folders only source files:
#   *.rs, *.toml  (no *.md / *.json - code and configs only)
#
# Service dirs are always skipped: target, _build, deps, .git,
# node_modules, playwright-report, test-results, cover, .pytest_cache,
# __pycache__.
#
# Alias groups:
#   MANIFEST             - root manifest (Cargo.toml; *.lock is excluded)
#   UWA_*_SRC            - src/ of each crate
#   UWA_*_TOML           - Cargo.toml of each crate
#   UWA_*_TESTS          - integration tests (tests/) of each crate
#   UWA_BIN_CONFIG       - uwa-bin config template (config.example.toml)
#
# Group aliases (value is a space-separated list of other aliases,
# expanded by dump.sh in collect_files):
#   ALL_SRCS, ALL_TOMLS, ALL_TESTS
#
# Usage:
#   ./dump.sh            -> all three dumps: source_dump.md, tests_dump.md, full_dump.md
#   ./dump.sh source     -> only source_dump.md
#   ./dump.sh tests      -> only tests_dump.md
#   ./dump.sh full       -> only full_dump.md
#   ./dump.sh percrate   -> separate dump for each crate
#   ./dump.sh stats      -> colored stats only, no dumps
#   ./dump.sh uwa-bin    -> dump of a single crate

# --- Root files -------------------------------------------------------
MANIFEST=Cargo.toml
# NOTE: Cargo.lock is NOT in the dump - dumps are source only.

# --- uwa-core (root-level crate) -------------------------------------
UWA_CORE_SRC=uwa-core/src
UWA_CORE_TOML=uwa-core/Cargo.toml
UWA_CORE_TESTS=uwa-core/tests

# --- crates/* ---------------------------------------------------------
# uwa-browser
UWA_BROWSER_SRC=crates/uwa-browser/src
UWA_BROWSER_TOML=crates/uwa-browser/Cargo.toml

# uwa-bin
UWA_BIN_SRC=crates/uwa-bin/src
UWA_BIN_TOML=crates/uwa-bin/Cargo.toml
UWA_BIN_CONFIG=crates/uwa-bin/config.example.toml

# uwa-config
UWA_CONFIG_SRC=crates/uwa-config/src
UWA_CONFIG_TOML=crates/uwa-config/Cargo.toml

# uwa-mcp
UWA_MCP_SRC=crates/uwa-mcp/src
UWA_MCP_TOML=crates/uwa-mcp/Cargo.toml
UWA_MCP_TESTS=crates/uwa-mcp/tests

# uwa-api
UWA_API_SRC=crates/uwa-api/src
UWA_API_TOML=crates/uwa-api/Cargo.toml
UWA_API_TESTS=crates/uwa-api/tests

# uwa-tools
UWA_TOOLS_SRC=crates/uwa-tools/src
UWA_TOOLS_TOML=crates/uwa-tools/Cargo.toml
UWA_TOOLS_TESTS=crates/uwa-tools/tests

# uwa-extract
UWA_EXTRACT_SRC=crates/uwa-extract/src
UWA_EXTRACT_TOML=crates/uwa-extract/Cargo.toml
UWA_EXTRACT_TESTS=crates/uwa-extract/tests

# --- Group aliases (space-separated alias lists) ----------------------
# All crate sources
ALL_SRCS=UWA_CORE_SRC UWA_BROWSER_SRC UWA_BIN_SRC UWA_CONFIG_SRC UWA_MCP_SRC UWA_API_SRC UWA_TOOLS_SRC UWA_EXTRACT_SRC
# All crate Cargo.toml files
ALL_TOMLS=UWA_CORE_TOML UWA_BROWSER_TOML UWA_BIN_TOML UWA_CONFIG_TOML UWA_MCP_TOML UWA_API_TOML UWA_TOOLS_TOML UWA_EXTRACT_TOML
# All integration tests
ALL_TESTS=UWA_CORE_TESTS UWA_API_TESTS UWA_MCP_TESTS UWA_TOOLS_TESTS UWA_EXTRACT_TESTS
