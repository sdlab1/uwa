# repo.conf - список папок и файлов source проекта (только Rust, только этот репозиторий)
# Каждая строка: алиас=путь (папка или отдельный файл)
#
# dump.sh собирает из папок файлы с расширениями:
#   *.rs, *.toml
#   (без *.md и *.json - только конфиги и код)
#
# Общее для обоих: пропускаются служебные каталоги (target, _build, deps,
# .git, node_modules, playwright-report, test-results, cover, .pytest_cache,
# __pycache__), а также любые артефакты прогонов тестов (логи, отчёты и т.д.).
#
# Алиасы разбиты на группы (для удобства чтения; реальное использование - в dump.sh):
#   MANIFEST, CARGO_LOCK - корневые файлы
#   * _SRC - исходные каталоги crate'ов
#   * _TOML - Cargo.toml каждого crate
#
# Пример использования:
#   ./dump.sh          → полный дамп всего source (full_dump.md)
#   ./dump.sh uwa-browser → дамп только crate uwa-browser (uwa-browser_dump.md)
#   ./dump.sh percrate → отдельный дамп для каждого crate

# ── Корневые файлы ─────────────────────────────────────────────────────
MANIFEST=Cargo.toml
CARGO_LOCK=Cargo.lock

# ── Каждая crate ──
# uwa-browser
UWA_BROWSER_SRC=crates/uwa-browser/src
UWA_BROWSER_TOML=crates/uwa-browser/Cargo.toml

# uwa-bin
UWA_BIN_SRC=crates/uwa-bin/src
UWA_BIN_TOML=crates/uwa-bin/Cargo.toml

# uwa-config
UWA_CONFIG_SRC=crates/uwa-config/src
UWA_CONFIG_TOML=crates/uwa-config/Cargo.toml

# uwa-mcp
UWA_MCP_SRC=crates/uwa-mcp/src
UWA_MCP_TOML=crates/uwa-mcp/Cargo.toml

# uwa-api
UWA_API_SRC=crates/uwa-api/src
UWA_API_TOML=crates/uwa-api/Cargo.toml

# uwa-tools
UWA_TOOLS_SRC=crates/uwa-tools/src
UWA_TOOLS_TOML=crates/uwa-tools/Cargo.toml

# uwa-extract
UWA_EXTRACT_SRC=crates/uwa-extract/src
UWA_EXTRACT_TOML=crates/uwa-extract/Cargo.toml

# ── Группы для dump.sh (опционально, удобно для полного дампа) ──
# Источники всех crate'ов (src)
ALL_SRCS=UWA_BROWSER_SRC UWA_BIN_SRC UWA_CONFIG_SRC UWA_MCP_SRC UWA_API_SRC UWA_TOOLS_SRC UWA_EXTRACT_SRC
# Все Cargo.toml crate'ов
ALL_TOMLS=UWA_BROWSER_TOML UWA_BIN_TOML UWA_CONFIG_TOML UWA_MCP_TOML UWA_API_TOML UWA_TOOLS_TOML UWA_EXTRACT_TOML
