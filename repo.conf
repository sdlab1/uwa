# repo.conf - list of source folders/files of project_uwa
# (Rust workspace + TypeScript/Node.js static UI + build guide).
# Each line: ALIAS=path (a folder or a single file), relative to repo root.
#
# dump.sh collects from folders only dumpable source files:
#   *.rs *.toml *.ts *.js *.css *.sh *.json *.html *.txt *.snap
#   (*.md only as explicitly whitelisted single files - *.md is gitignored)
# Directories are taken as git sees them: .gitignore rules apply, so
# target/, node_modules/, __pycache__/ etc. never leak into dumps.
#
# Alias groups:
#   MANIFEST             - root manifest (Cargo.toml; *.lock is excluded)
#   RUST_TOOLCHAIN       - rustup toolchain pin (rust-toolchain.toml)
#   CARGO_DEPS2          - crate dependency reference (cargo_dependencies2.toml)
#   UWA_*_SRC            - src/ of each crate
#   UWA_*_TOML           - Cargo.toml of each crate
#   UWA_*_TESTS          - integration tests (tests/) of each crate
#   UWA_*_EXTRA          - optional extra aliases glued into that crate's dumps
#   UWA_BIN_CONFIG       - uwa-bin config template (config.example.toml)
#
# Group aliases (value is a space-separated list of other aliases,
# expanded by dump.sh):
#   ALL_SRCS, ALL_TOMLS, ALL_TESTS
#   Adding a new crate = adding it here only; dump.sh picks it up
#   automatically (percrate dumps are derived from ALL_SRCS).
#
# Usage:
#   ./dump.sh            -> all three dumps: source_dump.md, tests_dump.md, full_dump.md
#   ./dump.sh source     -> only source_dump.md
#   ./dump.sh tests      -> only tests_dump.md
#   ./dump.sh full       -> only full_dump.md
#   ./dump.sh percrate   -> separate dump for each crate
#   ./dump.sh stats      -> colored stats only, no dumps
#   ./dump.sh uwa-bin    -> dump of a single crate

# --- Root files -------------------------------------------------------
MANIFEST=Cargo.toml
RUST_TOOLCHAIN=rust-toolchain.toml
CARGO_DEPS2=cargo_dependencies2.toml
RUST_BUILD_GUIDE=rust_build.md
# NOTE: lock files are NOT in the dump - dumps are source only
# (Cargo.lock, package-lock.json); dist/ build output is skipped too.

# --- uwa-core (root-level crate) -------------------------------------
UWA_CORE_SRC=uwa-core/src
UWA_CORE_TOML=uwa-core/Cargo.toml
UWA_CORE_TESTS=uwa-core/tests

# --- crates/* ---------------------------------------------------------
# uwa-api
UWA_API_SRC=crates/uwa-api/src
UWA_API_TOML=crates/uwa-api/Cargo.toml
UWA_API_TESTS=crates/uwa-api/tests

# uwa-api static UI (TypeScript / Node.js)
#   src/*.ts incl. views/, index.html, styles.css, package.json,
#   tsconfig.json, build.sh.  Skipped on purpose: dist/ (build output),
#   package-lock.json (lockfile), node_modules/ (deps, gitignored).
UWA_UI_TS=crates/uwa-api/static/src
UWA_UI_INDEX=crates/uwa-api/static/index.html
UWA_UI_CSS=crates/uwa-api/static/styles.css
UWA_UI_PACKAGE=crates/uwa-api/static/package.json
UWA_UI_TSCONFIG=crates/uwa-api/static/tsconfig.json
UWA_UI_BUILD=crates/uwa-api/static/build.sh
# Extra sources glued into the uwa-api crate dumps (used by dump.sh)
UWA_API_EXTRA=UWA_UI_TS UWA_UI_INDEX UWA_UI_CSS UWA_UI_PACKAGE UWA_UI_TSCONFIG UWA_UI_BUILD

# uwa-bin
UWA_BIN_SRC=crates/uwa-bin/src
UWA_BIN_TOML=crates/uwa-bin/Cargo.toml
UWA_BIN_TESTS=crates/uwa-bin/tests
UWA_BIN_CONFIG=crates/uwa-bin/config.example.toml

# uwa-browser
UWA_BROWSER_SRC=crates/uwa-browser/src
UWA_BROWSER_TOML=crates/uwa-browser/Cargo.toml
UWA_BROWSER_TESTS=crates/uwa-browser/tests

# uwa-config
UWA_CONFIG_SRC=crates/uwa-config/src
UWA_CONFIG_TOML=crates/uwa-config/Cargo.toml

# uwa-extract
UWA_EXTRACT_SRC=crates/uwa-extract/src
UWA_EXTRACT_TOML=crates/uwa-extract/Cargo.toml
UWA_EXTRACT_TESTS=crates/uwa-extract/tests

# uwa-history
UWA_HISTORY_SRC=crates/uwa-history/src
UWA_HISTORY_TOML=crates/uwa-history/Cargo.toml
UWA_HISTORY_TESTS=crates/uwa-history/tests

# uwa-lifecycle
UWA_LIFECYCLE_SRC=crates/uwa-lifecycle/src
UWA_LIFECYCLE_TOML=crates/uwa-lifecycle/Cargo.toml

# uwa-providers
UWA_PROVIDERS_SRC=crates/uwa-providers/src
UWA_PROVIDERS_TOML=crates/uwa-providers/Cargo.toml
UWA_PROVIDERS_TESTS=crates/uwa-providers/tests

# uwa-resilience
UWA_RESILIENCE_SRC=crates/uwa-resilience/src
UWA_RESILIENCE_TOML=crates/uwa-resilience/Cargo.toml

# uwa-session
UWA_SESSION_SRC=crates/uwa-session/src
UWA_SESSION_TOML=crates/uwa-session/Cargo.toml

# uwa-stealth
UWA_STEALTH_SRC=crates/uwa-stealth/src
UWA_STEALTH_TOML=crates/uwa-stealth/Cargo.toml

# uwa-testkit
UWA_TESTKIT_SRC=crates/uwa-testkit/src
UWA_TESTKIT_TOML=crates/uwa-testkit/Cargo.toml
UWA_TESTKIT_TESTS=crates/uwa-testkit/tests

# uwa-tools
UWA_TOOLS_SRC=crates/uwa-tools/src
UWA_TOOLS_TOML=crates/uwa-tools/Cargo.toml
UWA_TOOLS_TESTS=crates/uwa-tools/tests

# --- Group aliases (space-separated alias lists) ----------------------
# All crate sources
ALL_SRCS=UWA_CORE_SRC UWA_API_SRC UWA_BIN_SRC UWA_BROWSER_SRC UWA_CONFIG_SRC UWA_EXTRACT_SRC UWA_HISTORY_SRC UWA_LIFECYCLE_SRC UWA_PROVIDERS_SRC UWA_RESILIENCE_SRC UWA_SESSION_SRC UWA_STEALTH_SRC UWA_TESTKIT_SRC UWA_TOOLS_SRC
# All crate Cargo.toml files
ALL_TOMLS=UWA_CORE_TOML UWA_API_TOML UWA_BIN_TOML UWA_BROWSER_TOML UWA_CONFIG_TOML UWA_EXTRACT_TOML UWA_HISTORY_TOML UWA_LIFECYCLE_TOML UWA_PROVIDERS_TOML UWA_RESILIENCE_TOML UWA_SESSION_TOML UWA_STEALTH_TOML UWA_TESTKIT_TOML UWA_TOOLS_TOML
# All integration tests
ALL_TESTS=UWA_CORE_TESTS UWA_API_TESTS UWA_BIN_TESTS UWA_BROWSER_TESTS UWA_EXTRACT_TESTS UWA_HISTORY_TESTS UWA_PROVIDERS_TESTS UWA_TESTKIT_TESTS UWA_TOOLS_TESTS
